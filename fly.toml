# fly.toml app configuration file generated for canasta-server on 2026-09-14T10:38:52-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'canasta-server'
primary_region = 'dfw'

[build]
[env]
  CLIENT_URL = 'https://canasta.landanfagan.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
